[package]
name = "openpatchline"
version = "0.1.0"
description = "OpenPatchline - Git diff viewer"
authors = ["OpenPatchline contributors"]
license = "Apache-2.0"
repository = "https://github.com/dswj7273-lgtm/OpenPatchline"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
# 仅构建桌面端 rlib，避免 staticlib/cdylib 与 release panic=abort 在 bench 下产生产物文件名冲突 (cargo#6313)
name = "openpatchline_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
git2 = { version = "0.21.0", default-features = false }
thiserror = "2"
tauri-plugin-dialog = "2"
notify = "8"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[dev-dependencies]
tempfile = "3"

[[bench]]
name = "perf"
harness = false
